<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌸 Petal Atlas — 56 Ethnic Groups</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js">
    </script>
    <style>
        /* =============================================
                   KAWAII BUDDHIST LOTUS THEME (Pink/Lavender)
                   ============================================= */
        :root {
            --lotus-dark: #4A2C4A;
            --lotus-plum: #7A4B7A;
            --lotus-pink: #FF8FAB;
            --lotus-light: #FFB7C5;
            --lotus-pale: #FFF0F5;
            --lotus-gold: #FDE8C8;
            --cream-base: #FFF9FA;
            --mandala-gradient: linear-gradient(135deg, #F8E8FF, #FFD1DC, #FFB3C6);
            --text-dark: #3A2A3A;
            --card-shadow: 0 8px 25px rgba(255, 143, 171, 0.2);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Quicksand', -apple-system, sans-serif;
            background: var(--cream-base);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* --- Header --- */
        header {
            background: var(--mandala-gradient);
            padding: 1.8rem 1.5rem 1.2rem;
            text-align: center;
            color: var(--lotus-dark);
            position: relative;
            overflow: hidden;
            border-bottom: 3px solid rgba(255, 255, 255, 0.6);
        }
        header::before {
            content: "🌸";
            position: absolute;
            font-size: 8rem;
            right: -1rem;
            top: -2rem;
            opacity: 0.1;
            transform: rotate(15deg);
        }
        header h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.5);
            font-family: 'Quicksand', sans-serif;
        }
        header h1 span {
            font-size: 1.8rem;
        }
        header p {
            font-size: 1rem;
            opacity: 0.8;
            font-weight: 400;
        }

        /* --- Stats & Tabs --- */
        .stats-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            padding: 0.7rem 1rem;
            background: rgba(255, 143, 171, 0.08);
            border-bottom: 2px solid var(--lotus-light);
            flex-wrap: wrap;
        }
        .stats-bar span {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--lotus-dark);
        }
        .stats-bar strong {
            color: var(--lotus-pink);
        }

        .tab-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent;
            border: 2px solid var(--lotus-light);
            color: var(--lotus-plum);
            padding: 0.3rem 1.2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Quicksand', sans-serif;
        }
        .tab-btn:hover {
            background: var(--lotus-pale);
        }
        .tab-btn.active {
            background: var(--lotus-plum);
            border-color: var(--lotus-plum);
            color: white;
        }

        .search-wrapper {
            display: flex;
            justify-content: center;
            padding: 0.8rem 1rem;
            background: white;
            border-bottom: 1px solid #f0e8ee;
        }
        #searchInput {
            padding: 0.5rem 1.5rem;
            width: 100%;
            max-width: 400px;
            border: 2px solid #f0e8ee;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            background: var(--cream-base);
            font-family: 'Quicksand', sans-serif;
        }
        #searchInput:focus {
            border-color: var(--lotus-pink);
            box-shadow: 0 0 0 4px rgba(255, 143, 171, 0.2);
        }

        /* --- Views --- */
        .view {
            display: none;
            padding: 1rem 0.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .view.active {
            display: block;
        }

        /* --- Grid View (Cards) --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.2rem;
            padding: 0.5rem;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 1rem;
            box-shadow: var(--card-shadow);
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 4px solid var(--lotus-pink);
            border-bottom: 2px solid var(--lotus-pale);
        }
        .card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 12px 30px rgba(255, 143, 171, 0.3);
            border-left-color: var(--lotus-plum);
        }
        .card .id {
            font-size: 0.65rem;
            color: var(--lotus-pink);
            font-weight: 700;
            background: rgba(255, 143, 171, 0.1);
            display: inline-block;
            padding: 0.1rem 0.6rem;
            border-radius: 50px;
        }
        .card h3 {
            font-size: 1.2rem;
            color: var(--lotus-dark);
            margin: 0.1rem 0;
        }
        .card .chinese-name {
            font-size: 0.9rem;
            font-weight: 300;
            color: #b09ab0;
        }
        .card .region {
            font-size: 0.75rem;
            color: var(--lotus-plum);
            background: var(--lotus-pale);
            display: inline-block;
            padding: 0.1rem 0.7rem;
            border-radius: 50px;
            margin: 0.2rem 0;
        }
        .card .intro-preview {
            font-size: 0.8rem;
            color: #666;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card .population {
            font-size: 0.7rem;
            color: var(--lotus-pink);
            font-weight: 600;
            margin-top: 0.2rem;
        }

        /* --- Flower View (Canvas) --- */
        #flowerView {
            text-align: center;
            padding: 0.5rem;
        }
        #flowerView canvas {
            max-width: 100%;
            height: auto;
            border-radius: 60px;
            box-shadow: 0 20px 60px rgba(255, 143, 171, 0.25);
            background: radial-gradient(circle at 30% 20%, #FFF5F7, #FCE4EC);
            cursor: pointer;
            touch-action: none;
            border: 4px solid rgba(255, 255, 255, 0.8);
        }
        #flowerTooltip {
            margin-top: 0.8rem;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--lotus-plum);
            min-height: 2.5rem;
            background: rgba(255, 255, 255, 0.85);
            padding: 0.4rem 1.8rem;
            border-radius: 50px;
            display: inline-block;
            border: 2px solid var(--lotus-pale);
            backdrop-filter: blur(4px);
            font-family: 'Quicksand', sans-serif;
            box-shadow: 0 4px 15px rgba(255, 143, 171, 0.1);
        }
        #flowerTooltip small {
            font-weight: 300;
            color: #b09ab0;
            font-size: 0.8rem;
        }

        /* --- Map View --- */
        #mapView {
            padding: 0.5rem;
            height: 70vh;
            min-height: 500px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 8px 30px rgba(255, 143, 171, 0.08);
            position: relative;
        }
        #mapContainer {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            position: relative;
        }
        #mapContainer .map-error {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--lotus-plum);
            text-align: center;
            padding: 2rem;
        }
        #mapContainer .map-error button {
            margin-top: 1rem;
            padding: 0.6rem 2rem;
            border-radius: 50px;
            border: 2px solid var(--lotus-pink);
            background: white;
            color: var(--lotus-dark);
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Quicksand', sans-serif;
        }
        #mapContainer .map-error button:hover {
            background: var(--lotus-pink);
            color: white;
            transform: scale(1.05);
        }

        /* --- Modal --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(74, 44, 74, 0.5);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 1rem;
        }
        .modal.open {
            display: flex;
        }
        .modal-content {
            background: white;
            max-width: 480px;
            width: 100%;
            padding: 2rem 1.8rem;
            border-radius: 40px;
            position: relative;
            box-shadow: 0 30px 80px rgba(74, 44, 74, 0.3);
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-top: 8px solid var(--lotus-pink);
            border-bottom: 3px solid var(--lotus-pale);
        }
        .modal-content .close-btn {
            position: absolute;
            top: 0.8rem;
            right: 1.2rem;
            font-size: 2rem;
            cursor: pointer;
            color: #d4c0d4;
            background: none;
            border: none;
            transition: 0.3s;
        }
        .modal-content .close-btn:hover {
            color: var(--lotus-plum);
            transform: rotate(90deg) scale(1.2);
        }
        .modal-content h2 {
            color: var(--lotus-dark);
            font-size: 2rem;
            font-family: 'Quicksand', sans-serif;
        }
        .modal-content .chinese-name {
            font-size: 1.2rem;
            color: #b09ab0;
        }
        .modal-content .detail-region {
            background: var(--lotus-pale);
            padding: 0.2rem 1rem;
            border-radius: 50px;
            display: inline-block;
            margin: 0.5rem 0;
            color: var(--lotus-plum);
        }
        .modal-content .detail-population {
            font-weight: 700;
            color: var(--lotus-pink);
        }
        .modal-content .full-intro {
            margin-top: 1rem;
            line-height: 1.7;
            color: #4a3a4a;
        }

        footer {
            text-align: center;
            padding: 1.2rem;
            background: var(--lotus-dark);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            margin-top: 1rem;
            font-family: 'Quicksand', sans-serif;
        }
        footer span {
            color: var(--lotus-light);
        }

        @keyframes popIn {
            0% {
                transform: scale(0.8) translateY(20px);
                opacity: 0;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
            }
            header h1 span {
                font-size: 1.2rem;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 0.8rem;
            }
            .tab-btn {
                font-size: 0.7rem;
                padding: 0.2rem 0.8rem;
            }
            .stats-bar {
                gap: 0.5rem;
            }
            #mapView {
                height: 50vh;
                min-height: 300px;
            }
            #flowerView canvas {
                border-radius: 30px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1><span>🌸</span> Petal Atlas</h1>
        <p>Exploring the sacred diversity of 56 ethnic groups</p>
    </header>

    <div class="stats-bar">
        <span>🏮 <strong id="groupCount">56</strong> Groups</span>
        <span>👥 <strong id="popCount">~1.4B</strong> Combined</span>
        <div class="tab-group">
            <button class="tab-btn active" data-view="grid">📋 Grid</button>
            <button class="tab-btn" data-view="flower">🌸 Lotus</button>
            <button class="tab-btn" data-view="map">🗺️ Map</button>
        </div>
    </div>

    <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="Search for a group..." />
    </div>

    <!-- ===== GRID VIEW ===== -->
    <div id="gridView" class="view active">
        <main id="app">
            <p style="text-align:center;padding:2rem;color:#b09ab0;">🌸 Loading...</p>
        </main>
    </div>

    <!-- ===== FLOWER VIEW ===== -->
    <div id="flowerView" class="view">
        <canvas id="flowerCanvas" width="700" height="700"></canvas>
        <div id="flowerTooltip">🌸 Hover over a petal <small>✦ click to learn more</small></div>
    </div>

    <!-- ===== MAP VIEW ===== -->
    <div id="mapView" class="view">
        <div id="mapContainer">
            <div class="map-error">
                <p>🌸 Click "Try Again" to load the map</p>
                <button onclick="initMap()">🔄 Try Again</button>
            </div>
        </div>
    </div>

    <!-- ===== MODAL ===== -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <h2 id="modalName">Name</h2>
            <div class="chinese-name" id="modalChinese">中文名</div>
            <div class="detail-region" id="modalRegion">📍 Region</div>
            <div class="detail-population" id="modalPopulation">👥 Population</div>
            <div class="full-intro" id="modalIntro">Description...</div>
        </div>
    </div>

    <footer>
        <span>🌸</span> Petal Atlas — A mindful journey through China's cultures <span>✦</span>
    </footer>

    <script>

            { id: "03", name: "Hui", chineseName: "回族", population: "11.3 million", region: "Ningxia, Gansu",

        // ================================================================
        // 2. GRID VIEW LOGIC
        // ================================================================
        function renderGrid(groups) {
            const app = document.getElementById('app');
            if (!groups.length) {
                app.innerHTML = '<p style="text-align:center;padding:2rem;color:#b09ab0;">🌸 No groups found.</p>';
                return;
            }
            let html = '<div class="grid">';
            groups.forEach(g => {
                html += `
                        <div class="card" onclick="openDetail('${g.id}')">
                            <div class="id">#${g.id}</div>
                            <h3>${g.name}</h3>
                            <div class="chinese-name">${g.chineseName}</div>
                            <div class="region">📍 ${g.region}</div>
                            <div class="intro-preview">${g.intro.slice(0, 50)}...</div>
                            <div class="population">👥 ${g.population}</div>
                        </div>
                    `;
            });
            html += '</div>';
            app.innerHTML = html;
        }

        function updateStats(groups) {
            document.getElementById('groupCount').textContent = groups.length;
            let total = 0;
            groups.forEach(g => {
                const num = parseFloat(g.population.replace(/[^0-9.]/g, ''));
                if (!isNaN(num)) total += num;
            });
            document.getElementById('popCount').textContent = (total > 1000) ? (total / 1000).toFixed(1) + 'B' : total
                .toLocaleString() + 'M';
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = allGroups.filter(g =>
                g.name.toLowerCase().includes(q) ||
                g.chineseName.includes(q) ||
                g.region.toLowerCase().includes(q)
            );
            renderGrid(filtered);
            updateStats(filtered);
        });

            document.getElementById('modalPopulation').textContent = '👥 Population: ' + g.population;
            document.getElementById('modalIntro').textContent = g.intro;

        // ================================================================
        // 5. THICK KAWAII LOTUS (CHUNKY PETALS)
        // ================================================================
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('flowerTooltip');
        const W = 700,
            H = 700;
        const cx = 350,
            cy = 340;
        const radius = 230;
        const totalGroups = allGroups.length;
        let hoveredIndex = -1;

        function drawSparkle(x, y, size, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = color || 'rgba(255, 255, 255, 0.8)';
            ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const r = (i % 2 === 0) ? size : size * 0.3;
                if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
                else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
            }
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        function drawThickLotus() {
            ctx.clearRect(0, 0, W, H);

            const bgGrad = ctx.createRadialGradient(cx, cy - 50, 50, cx, cy, 400);
            bgGrad.addColorStop(0, '#FFF5F7');
            bgGrad.addColorStop(0.5, '#FCE4EC');
            bgGrad.addColorStop(1, '#F8E8FF');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            const sparklePositions = [
                [100, 100, 6],
                [600, 90, 8],
                [80, 500, 5],
                [630, 550, 7],
                [150, 650, 6],
                [550, 650, 5],
                [350, 60, 9],
                [200, 200, 4],
                [500, 200, 4]
            ];
            sparklePositions.forEach(([x, y, s]) => {
                drawSparkle(x, y, s, 'rgba(255, 255, 255, 0.5)');
            });

            // Stem & Leaves
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(cx, cy + 50);
            ctx.quadraticCurveTo(cx + 15, cy + 100, cx - 5, cy + 180);
            ctx.quadraticCurveTo(cx - 20, cy + 240, cx + 8, cy + 300);
            ctx.strokeStyle = '#D4A0A0';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.shadowColor = 'rgba(180, 120, 120, 0.2)';
            ctx.shadowBlur = 10;
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#E8C8C8';
            ctx.shadowBlur = 8;
            ctx.shadowColor = 'rgba(180, 120, 120, 0.15)';
            ctx.beginPath();
            ctx.ellipse(cx - 35, cy + 110, 20, 10, -0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#D4A0A0';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(cx + 40, cy + 150, 22, 11, 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();

            // THICK PETALS
            const slice = (2 * Math.PI) / totalGroups;
            for (let i = 0; i < totalGroups; i++) {
                const angle = i * slice - Math.PI / 2;
                const nextAngle = angle + slice;
                const midAngle = angle + slice / 2;

                const innerR = 45;
                const outerR = radius;

                const x1 = cx + Math.cos(angle) * innerR;
                const y1 = cy + Math.sin(angle) * innerR;
                const x2 = cx + Math.cos(nextAngle) * innerR;
                const y2 = cy + Math.sin(nextAngle) * innerR;
                const tipX = cx + Math.cos(midAngle) * outerR;
                const tipY = cy + Math.sin(midAngle) * outerR;

                const cpSpread = slice * 0.32;
                const cpRadius = outerR * 0.95;

                const cp1x = cx + Math.cos(angle + cpSpread) * cpRadius;
                const cp1y = cy + Math.sin(angle + cpSpread) * cpRadius;
                const cp2x = cx + Math.cos(nextAngle - cpSpread) * cpRadius;
                const cp2y = cy + Math.sin(nextAngle - cpSpread) * cpRadius;
                const tipOffset = 6;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.bezierCurveTo(
                    cp1x, cp1y,
                    tipX - Math.cos(midAngle) * tipOffset, tipY - Math.sin(midAngle) * tipOffset,
                    tipX, tipY
                );
                ctx.bezierCurveTo(
                    tipX + Math.cos(midAngle) * tipOffset, tipY + Math.sin(midAngle) * tipOffset,
                    cp2x, cp2y,
                    x2, y2
                );
                ctx.closePath();

                const hue = 330 + (i / totalGroups) * 40;
                const sat = 60 + (i % 5) * 5;
                const lig = (i === hoveredIndex) ? 78 : 62;

                const grad = ctx.createRadialGradient(
                    cx + Math.cos(midAngle) * 40, cy + Math.sin(midAngle) * 40, 15,
                    cx + Math.cos(midAngle) * 90, cy + Math.sin(midAngle) * 90, outerR
                );
                grad.addColorStop(0, `hsl(${hue + 15}, ${sat + 10}%, ${lig + 18}%)`);
                grad.addColorStop(0.5, `hsl(${hue}, ${sat}%, ${lig}%)`);
                grad.addColorStop(1, `hsl(${hue - 10}, ${sat - 10}%, ${lig - 15}%)`);

                ctx.fillStyle = grad;
                ctx.shadowColor = (i === hoveredIndex) ? 'rgba(255, 143, 171, 0.6)' : 'rgba(180, 120, 140, 0.15)';
                ctx.shadowBlur = (i === hoveredIndex) ? 40 : 15;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                const labelR = radius * 0.6;
                const lx = cx + Math.cos(midAngle) * labelR;
                const ly = cy + Math.sin(midAngle) * labelR;
                ctx.beginPath();
                ctx.arc(lx, ly, 13, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fill();
                ctx.fillStyle = (i === hoveredIndex) ? '#4A2C4A' : 'rgba(74, 44, 74, 0.75)';
                ctx.font = 'bold 10px "Quicksand", "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(255,255,255,0.6)';
                ctx.shadowBlur = 6;
                ctx.fillText(i + 1, lx, ly + 1);
                ctx.shadowBlur = 0;
            }

            // Center Pearl
            const pearlGrad = ctx.createRadialGradient(cx - 15, cy - 20, 5, cx, cy, 50);
            pearlGrad.addColorStop(0, '#FFFFFF');
            pearlGrad.addColorStop(0.3, '#FFE4EC');
            pearlGrad.addColorStop(0.7, '#FFB3C6');
            pearlGrad.addColorStop(1, '#D8B4E2');
            ctx.shadowColor = 'rgba(255, 143, 171, 0.7)';
            ctx.shadowBlur = 50;
            ctx.beginPath();
            ctx.arc(cx, cy, 45, 0, 2 * Math.PI);
            ctx.fillStyle = pearlGrad;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(cx, cy, 38, 0, 2 * Math.PI);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 2;
            ctx.stroke();

            drawSparkle(cx - 25, cy - 25, 7, 'rgba(255, 255, 255, 0.95)');
            drawSparkle(cx + 32, cy + 22, 6, 'rgba(255, 255, 255, 0.85)');
            drawSparkle(cx - 32, cy + 32, 8, 'rgba(255, 255, 255, 0.75)');
            drawSparkle(cx + 38, cy - 32, 6, 'rgba(255, 255, 255, 0.85)');

            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const a = (i / 8) * Math.PI * 2 - Math.PI / 2;
                const r = 20;
                const px = cx + Math.cos(a) * r;
                const py = cy + Math.sin(a) * r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1.2;
            ctx.stroke();
        }

        // --- Flower Interactions ---
        function getFlowerIndex(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;
            const dx = x - cx;
            const dy = y - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > radius || dist < 35) return -1;
            let angle = Math.atan2(dy, dx);
            let adjusted = angle + Math.PI / 2;
            if (adjusted < 0) adjusted += 2 * Math.PI;
            const slice = (2 * Math.PI) / totalGroups;
            const index = Math.floor(adjusted / slice);
            if (index >= totalGroups) return 0;
            return index;
        }

        function onFlowerMove(e) {
            const idx = getFlowerIndex(e);
            if (idx !== hoveredIndex) {
                hoveredIndex = idx;
                drawThickLotus();
                if (idx >= 0 && idx < totalGroups) {
                    const g = allGroups[idx];
                    tooltip.innerHTML =
                        `🌸 ${g.name} (${g.chineseName}) <small>✦ ${g.region} · 👥 ${g.population}</small>`;
                    canvas.style.cursor = 'pointer';
                } else {
                    tooltip.innerHTML = '🌸 Hover over a petal <small>✦ click to learn more</small>';
                    canvas.style.cursor = 'default';
                }
            }
        }

        function onFlowerClick(e) {
            const idx = getFlowerIndex(e);
            if (idx >= 0 && idx < totalGroups) {
                openDetail(allGroups[idx].id);
            }
        }

        canvas.addEventListener('mousemove', onFlowerMove);
        canvas.addEventListener('click', onFlowerClick);
        canvas.addEventListener('touchstart', (e) => {
            onFlowerMove(e);
            onFlowerClick(e);
        });
        canvas.addEventListener('touchmove', (e) => {
            onFlowerMove(e);
        });

        // ================================================================
        // 6. BULLETPROOF MAP (with Retry & Error Handling)
        // ================================================================
        let mapChart = null;
        let mapLoading = false;

        function initMap() {
            const container = document.getElementById('mapContainer');
            if (!container) return;

            // If it's already loading, don't stack requests
            if (mapLoading) return;

            // Dispose old chart if exists
            if (mapChart) {
                mapChart.dispose();
                mapChart = null;
            }

            // Clear container and show loading
            container.innerHTML =
                '<p style="text-align:center;padding:3rem;color:#b09ab0;">🌸 Loading map data...</p>';

            mapLoading = true;

            // Create new chart instance
            mapChart = echarts.init(container);
            mapChart.showLoading();

            const geoUrl = 'https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json';

            fetch(geoUrl, { mode: 'cors' })
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status} - ${res.statusText}`);
                    return res.json();
                })
                .then(chinaJson => {
                    mapChart.hideLoading();
                    echarts.registerMap('china', chinaJson);
                    mapLoading = false;

                    const scatterData = allGroups.map(g => ({
                        name: g.name,
                        value: [...g.coords, 1],
                        chineseName: g.chineseName,
                        region: g.region,
                        population: g.population,
                        id: g.id,
                        intro: g.intro
                    }));

                    const option = {
                        tooltip: {
                            trigger: 'item',
                            formatter: function(params) {
                                if (params.seriesType === 'scatter') {
                                    const d = params.data;
                                    return `
                                            <strong>${d.name}</strong> (${d.chineseName})<br/>
                                            📍 ${d.region}<br/>
                                            👥 ${d.population}<br/>
                                            <span style="color:#FF8FAB;">✦ Click to learn more</span>
                                        `;
                                }
                                return params.name;
                            }
                        },
                        visualMap: {
                            show: false,
                            min: 0,
                            max: 1,
                            inRange: { color: ['#FFF0F5', '#FF8FAB'] }
                        },
                        geo: {
                            map: 'china',
                            roam: true,
                            zoom: 1.2,
                            center: [104, 35],
                            itemStyle: {
                                areaColor: '#FFF0F5',
                                borderColor: '#FFB3C6',
                                borderWidth: 1.5,
                                shadowColor: 'rgba(255,143,171,0.1)',
                                shadowBlur: 8
                            },
                            emphasis: {
                                itemStyle: { areaColor: '#FFD1DC' }
                            }
                        },
                        series: [{
                            name: 'Ethnic Groups',
                            type: 'scatter',
                            coordinateSystem: 'geo',
                            data: scatterData,
                            symbolSize: 16,
                            label: {
                                show: true,
                                formatter: function(params) { return params.name; },
                                position: 'right',
                                color: '#4A2C4A',
                                fontSize: 9,
                                fontWeight: 'bold',
                                textShadowColor: 'white',
                                textShadowBlur: 4
                            },
                            itemStyle: {
                                color: function(params) {
                                    const hues = [330, 350, 340, 320];
                                    return `hsl(${hues[params.dataIndex % hues.length]}, 70%, 65%)`;
                                },
                                shadowBlur: 12,
                                shadowColor: 'rgba(255, 143, 171, 0.4)',
                                borderColor: 'white',
                                borderWidth: 2.5
                            },
                            emphasis: {
                                itemStyle: {
                                    shadowBlur: 25,
                                    shadowColor: 'rgba(255, 143, 171, 0.8)',
                                    borderWidth: 3
                                }
                            }
                        }]
                    };

                    mapChart.setOption(option);

                    // CRITICAL: Force resize after data is loaded
                    setTimeout(() => {
                        if (mapChart) mapChart.resize();
                    }, 100);

                    mapChart.off('click');
                    mapChart.on('click', function(params) {
                        if (params.componentType === 'series') {
                            const data = params.data;
                            if (data && data.id) openDetail(data.id);
                        }
                    });

                    // Handle window resize globally
                    if (!window._mapResizeListener) {
                        window.addEventListener('resize', () => {
                            if (mapChart) mapChart.resize();
                        });
                        window._mapResizeListener = true;
                    }

                })
                .catch(err => {
                    mapChart.hideLoading();
                    mapLoading = false;
                    console.error('Map Error:', err);
                    // Show error with retry button
                    container.innerHTML = `
                            <div class="map-error">
                                <p style="font-size:1.2rem;color:#4A2C4A;">🌸 Map couldn't load</p>
                                <p style="font-size:0.9rem;color:#b09ab0;max-width:300px;">${err.message || 'Unknown error'}</p>
                                <p style="font-size:0.8rem;color:#d4c0d4;max-width:300px;margin-top:0.2rem;">
                                    ⚠️ This usually happens if the map server is busy.<br>
                                    Try again in a few seconds.
                                </p>
                                <button onclick="initMap()">🔄 Try Again</button>
                            </div>
                        `;
                });
        }

        // ================================================================
        // 7. START THE APP
        // ================================================================
        renderGrid(allGroups);
        updateStats(allGroups);
        drawThickLotus();

        // Pre-load map only after page is fully loaded and visible
        window.addEventListener('load', () => {
            // Wait a bit before preloading to not block the initial render
            setTimeout(() => {
                // Only preload if the map tab is the active one? No, we can preload in background.
                // But to save bandwidth, we can check if it's visible.
                const mapView = document.getElementById('mapView');
                if (mapView.classList.contains('active')) {
                    initMap();
                } else {
                    // Still preload silently if you want, but the user will see loading when they click.
                    // Let's just leave it to load on tab click to save resources.
                    // However, to make it feel instant, we can preload.
                    initMap();
                }
            }, 800);
        });

        // Also ensure map loads if user clicks the tab
        // The tab click handler already calls initMap or resize.
    </script>

</body>
</html>
