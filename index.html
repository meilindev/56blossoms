<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>56 Blossoms — Flower & Map</title>
    <!-- ECharts CDN for the interactive map -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js">
    </script>
    <style>
        /* =============================================
                   JADE/GREEN THEME
                   ============================================= */
        :root {
            --jade-dark: #1A3C2A;
            --jade-bright: #2D8A4E;
            --jade-light: #74C69D;
            --jade-pale: #D8F3DC;
            --gold-accent: #C9A96E;
            --cream-base: #F4FAF5;
            --earth-brown: #5C6B4B;
            --mandala-gradient: linear-gradient(135deg, #1A3C2A, #2D6A4F, #40916C, #74C69D);
            --text-dark: #1A2E1A;
            --card-shadow: 0 8px 25px rgba(26, 60, 42, 0.15);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--cream-base);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* --- Header --- */
        header {
            background: var(--mandala-gradient);
            padding: 1.8rem 1.5rem 1.2rem;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }
        header::before {
            content: "🌸";
            position: absolute;
            font-size: 8rem;
            right: -1rem;
            top: -2rem;
            opacity: 0.08;
            transform: rotate(15deg);
        }
        header h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        header p {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        /* --- Stats & Tabs --- */
        .stats-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            padding: 0.7rem 1rem;
            background: rgba(26, 60, 42, 0.05);
            border-bottom: 2px solid var(--jade-bright);
            flex-wrap: wrap;
        }
        .stats-bar span {
            font-size: 0.85rem;
            font-weight: 500;
        }
        .stats-bar strong {
            color: var(--jade-dark);
        }

        .tab-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent;
            border: 2px solid var(--jade-light);
            color: var(--jade-dark);
            padding: 0.3rem 1.2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn:hover {
            background: var(--jade-pale);
        }
        .tab-btn.active {
            background: var(--jade-dark);
            border-color: var(--jade-dark);
            color: white;
        }

        .search-wrapper {
            display: flex;
            justify-content: center;
            padding: 0.8rem 1rem;
            background: white;
            border-bottom: 1px solid #eee;
        }
        #searchInput {
            padding: 0.5rem 1.5rem;
            width: 100%;
            max-width: 400px;
            border: 2px solid #eee;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            background: var(--cream-base);
        }
        #searchInput:focus {
            border-color: var(--jade-bright);
            box-shadow: 0 0 0 4px rgba(45, 138, 78, 0.2);
        }

        /* --- Views --- */
        .view {
            display: none;
            padding: 1rem 0.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .view.active {
            display: block;
        }

        /* --- Grid View (Cards) --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.2rem;
            padding: 0.5rem;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 1rem;
            box-shadow: var(--card-shadow);
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 4px solid var(--jade-bright);
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(26, 60, 42, 0.2);
        }
        .card .id {
            font-size: 0.65rem;
            color: var(--jade-bright);
            font-weight: 700;
            background: rgba(45, 138, 78, 0.1);
            display: inline-block;
            padding: 0.1rem 0.6rem;
            border-radius: 50px;
        }
        .card h3 {
            font-size: 1.2rem;
            color: var(--jade-dark);
            margin: 0.1rem 0;
        }
        .card .chinese-name {
            font-size: 0.9rem;
            font-weight: 300;
            color: #888;
        }
        .card .region {
            font-size: 0.75rem;
            color: var(--earth-brown);
            background: #f0f5ed;
            display: inline-block;
            padding: 0.1rem 0.7rem;
            border-radius: 50px;
            margin: 0.2rem 0;
        }
        .card .intro-preview {
            font-size: 0.8rem;
            color: #555;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card .population {
            font-size: 0.7rem;
            color: var(--jade-bright);
            font-weight: 600;
            margin-top: 0.2rem;
        }

        /* --- Flower View (Canvas) --- */
        #flowerView {
            text-align: center;
            padding: 0.5rem;
        }
        #flowerView canvas {
            max-width: 100%;
            height: auto;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(26, 60, 42, 0.25);
            background: radial-gradient(circle at 30% 30%, #E8F5E9, #C8E6C9);
            cursor: pointer;
            touch-action: none;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }
        #flowerTooltip {
            margin-top: 0.8rem;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--jade-dark);
            min-height: 2.5rem;
            background: rgba(255, 255, 255, 0.85);
            padding: 0.4rem 1.5rem;
            border-radius: 50px;
            display: inline-block;
            border: 2px solid var(--jade-pale);
            backdrop-filter: blur(4px);
        }
        #flowerTooltip small {
            font-weight: 300;
            color: #888;
            font-size: 0.8rem;
        }

        /* --- Map View --- */
        #mapView {
            padding: 0.5rem;
            height: 70vh;
            min-height: 500px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
        }
        #mapContainer {
            width: 100%;
            height: 100%;
            border-radius: 16px;
        }

        /* --- Modal --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 1rem;
        }
        .modal.open {
            display: flex;
        }
        .modal-content {
            background: white;
            max-width: 480px;
            width: 100%;
            padding: 2rem 1.8rem;
            border-radius: 30px;
            position: relative;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            animation: popIn 0.3s ease-out;
            border-top: 8px solid var(--jade-bright);
        }
        .modal-content .close-btn {
            position: absolute;
            top: 0.8rem;
            right: 1.2rem;
            font-size: 2rem;
            cursor: pointer;
            color: #aaa;
            background: none;
            border: none;
            transition: 0.3s;
        }
        .modal-content .close-btn:hover {
            color: var(--jade-dark);
            transform: rotate(90deg);
        }
        .modal-content h2 {
            color: var(--jade-dark);
            font-size: 2rem;
        }
        .modal-content .chinese-name {
            font-size: 1.2rem;
            color: #999;
        }
        .modal-content .detail-region {
            background: #f0f5ed;
            padding: 0.2rem 1rem;
            border-radius: 50px;
            display: inline-block;
            margin: 0.5rem 0;
        }
        .modal-content .detail-population {
            font-weight: 700;
            color: var(--jade-bright);
        }
        .modal-content .full-intro {
            margin-top: 1rem;
            line-height: 1.7;
            color: #333;
        }

        footer {
            text-align: center;
            padding: 1.2rem;
            background: var(--text-dark);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            margin-top: 1rem;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.9) translateY(20px);
                opacity: 0;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 0.8rem;
            }
            .tab-btn {
                font-size: 0.7rem;
                padding: 0.2rem 0.8rem;
            }
            .stats-bar {
                gap: 0.5rem;
            }
            #mapView {
                height: 50vh;
                min-height: 300px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🌸 56 Blossoms</h1>
        <p>A living garden of China's ethnic diversity</p>
    </header>

    <div class="stats-bar">
        <span>🏮 <strong id="groupCount">56</strong> Groups</span>
        <span>👥 <strong id="popCount">~1.4B</strong> Combined</span>

    <div class="search-wrapper">

    <!-- ===== GRID VIEW ===== -->
    <div id="gridView" class="view active">

    <!-- ===== FLOWER VIEW ===== -->
    <div id="flowerView" class="view">
        <canvas id="flowerCanvas" width="700" height="700"></canvas>
        <div id="flowerTooltip">🌸 Hover over a petal <small>(click to learn more)</small></div>
    </div>

    <!-- ===== MAP VIEW ===== -->
    <div id="mapView" class="view">
        <div id="mapContainer"></div>
    </div>

    <!-- ===== MODAL ===== -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <h2 id="modalName">Name</h2>
            <div class="chinese-name" id="modalChinese">中文名</div>
            <div class="detail-region" id="modalRegion">📍 Region</div>
            <div class="detail-population" id="modalPopulation">👥 Population</div>
            <div class="full-intro" id="modalIntro">Description...</div>
        </div>
    </div>

    <footer>
        <span>🌸 56 Blossoms — A botanical journey through China's cultures</span>
    </footer>

                coords: [135.0, 48.0],
                intro: "One of the smallest, living along the Amur River. Known for their fish-skin clothing and fishing culture." },
            { id: "55", name: "Lhoba", chineseName: "珞巴族", population: "3,700", region: "Tibet",
                coords: [95.0, 29.0],
                intro: "Live in the eastern Himalayas. Known for their woven cane helmets and deep shamanic traditions linked to nature spirits." },
            { id: "56", name: "Gaoshan", chineseName: "高山族", population: "300,000 (in Taiwan)", region: "Taiwan",
                coords: [121.5, 25.0],
                intro: "Indigenous peoples of Taiwan. Comprising multiple tribes, known for their wood carving, weaving, and the spectacular 'Harvest Festival'." }
        ];

        // ================================================================
        // 2. GRID VIEW LOGIC
        // ================================================================
        function renderGrid(groups) {
            const app = document.getElementById('app');
            if (!groups.length) {
                app.innerHTML = '<p style="text-align:center;padding:2rem;color:#888;">🌸 No groups found.</p>';
                return;
            }
            let html = '<div class="grid">';
            groups.forEach(g => {
                html += `
                        <div class="card" onclick="openDetail('${g.id}')">
                            <div class="id">#${g.id}</div>
                            <h3>${g.name}</h3>
                            <div class="chinese-name">${g.chineseName}</div>
                            <div class="region">📍 ${g.region}</div>
                            <div class="intro-preview">${g.intro.slice(0, 50)}...</div>
                            <div class="population">👥 ${g.population}</div>
                        </div>
                    `;
            });
            html += '</div>';
            app.innerHTML = html;
        }

        function updateStats(groups) {
            document.getElementById('groupCount').textContent = groups.length;
            let total = 0;
            groups.forEach(g => {
                const num = parseFloat(g.population.replace(/[^0-9.]/g, ''));
                if (!isNaN(num)) total += num;
            });
            document.getElementById('popCount').textContent = (total > 1000) ? (total / 1000).toFixed(1) + 'B' : total
            .toLocaleString() + 'M';
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = allGroups.filter(g =>
                g.name.toLowerCase().includes(q) ||
                g.chineseName.includes(q) ||
                g.region.toLowerCase().includes(q)
            );
            renderGrid(filtered);
            updateStats(filtered);
        });

        // ================================================================
        // 3. MODAL
        // ================================================================
        function openDetail(id) {
            const g = allGroups.find(x => x.id === id);
            if (!g) return;
            document.getElementById('modalName').textContent = g.name;
            document.getElementById('modalChinese').textContent = g.chineseName;
            document.getElementById('modalRegion').textContent = '📍 ' + g.region;
            document.getElementById('modalPopulation').textContent = '👥 Population: ' + g.population;
            document.getElementById('modalIntro').textContent = g.intro;
            document.getElementById('detailModal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('open');
        }
        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ================================================================
        // 4. TAB SWITCHING
        // ================================================================
        const tabs = document.querySelectorAll('.tab-btn');
        const views = {
            grid: document.getElementById('gridView'),
            flower: document.getElementById('flowerView'),
            map: document.getElementById('mapView')
        };

        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                tabs.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const view = btn.dataset.view;
                Object.keys(views).forEach(key => {
                    views[key].classList.toggle('active', key === view);
                });
                if (view === 'flower') drawArtsyFlower();
                if (view === 'map') setTimeout(initMap, 100);
            });
        });

        // ================================================================
        // 5. ARTSY FLOWER MANDALA (Botanical illustration style)
        // ================================================================
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('flowerTooltip');
        const W = 700,
            H = 700;
        const cx = 350,
            cy = 340; // Slightly above center to leave room for stem
        const radius = 240;
        const total = allGroups.length;
        let hoveredIndex = -1;

        function drawArtsyFlower() {
            ctx.clearRect(0, 0, W, H);

            // --- 1. Draw STEM & LEAVES (background) ---
            ctx.save();
            // Stem
            ctx.beginPath();
            ctx.moveTo(cx, cy + 50);
            ctx.quadraticCurveTo(cx + 10, cy + 100, cx - 5, cy + 180);
            ctx.quadraticCurveTo(cx - 15, cy + 240, cx + 5, cy + 290);
            ctx.strokeStyle = '#2D6A4F';
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.shadowColor = 'rgba(0,0,0,0.1)';
            ctx.shadowBlur = 8;
            ctx.stroke();

            // Leaves (left)
            ctx.shadowBlur = 6;
            ctx.fillStyle = '#40916C';
            ctx.beginPath();
            ctx.moveTo(cx + 2, cy + 110);
            ctx.quadraticCurveTo(cx - 60, cy + 80, cx - 80, cy + 130);
            ctx.quadraticCurveTo(cx - 30, cy + 140, cx + 2, cy + 110);
            ctx.fill();
            ctx.strokeStyle = '#2D6A4F';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Leaves (right)
            ctx.fillStyle = '#52B788';
            ctx.beginPath();
            ctx.moveTo(cx + 2, cy + 150);
            ctx.quadraticCurveTo(cx + 70, cy + 120, cx + 90, cy + 170);
            ctx.quadraticCurveTo(cx + 40, cy + 180, cx + 2, cy + 150);
            ctx.fill();
            ctx.stroke();

            ctx.restore();

            // --- 2. Draw 56 PETALS (Teardrop/ellipse shapes) ---
            const slice = (2 * Math.PI) / total;

            for (let i = 0; i < total; i++) {
                const angle = i * slice - Math.PI / 2;
                const nextAngle = angle + slice;

                // Petal shape: a beautiful teardrop
                const midAngle = angle + slice / 2;
                const innerR = 40; // Start from center-ish
                const outerR = radius;

                // Control points for a natural petal bulge
                const bulgeFactor = 1.3;
                const r1 = innerR + (outerR - innerR) * 0.4;
                const r2 = outerR;

                const x1 = cx + Math.cos(angle) * innerR;
                const y1 = cy + Math.sin(angle) * innerR;
                const x2 = cx + Math.cos(nextAngle) * innerR;
                const y2 = cy + Math.sin(nextAngle) * innerR;

                const tipX = cx + Math.cos(midAngle) * outerR;
                const tipY = cy + Math.sin(midAngle) * outerR;

                const cp1x = cx + Math.cos(angle + slice * 0.25) * (outerR * 0.9);
                const cp1y = cy + Math.sin(angle + slice * 0.25) * (outerR * 0.9);
                const cp2x = cx + Math.cos(nextAngle - slice * 0.25) * (outerR * 0.9);
                const cp2y = cy + Math.sin(nextAngle - slice * 0.25) * (outerR * 0.9);

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
                ctx.closePath();

                // Color based on index (green gradient around the wheel)
                const hue = 120 + (i / total) * 70; // 120 to 190 (green to teal)
                const sat = 65;
                const lig = (i === hoveredIndex) ? 72 : 50;

                // Inner gradient for depth
                const grad = ctx.createRadialGradient(
                    cx + Math.cos(midAngle) * 20, cy + Math.sin(midAngle) * 20, 10,
                    cx + Math.cos(midAngle) * 80, cy + Math.sin(midAngle) * 80, outerR
                );
                grad.addColorStop(0, `hsl(${hue + 20}, ${sat + 10}%, ${lig + 20}%)`);
                grad.addColorStop(0.6, `hsl(${hue}, ${sat}%, ${lig}%)`);
                grad.addColorStop(1, `hsl(${hue - 10}, ${sat - 10}%, ${lig - 15}%)`);

                ctx.fillStyle = grad;
                ctx.shadowColor = (i === hoveredIndex) ? 'rgba(45, 138, 78, 0.5)' : 'rgba(0,0,0,0.1)';
                ctx.shadowBlur = (i === hoveredIndex) ? 25 : 8;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 0.5;
                ctx.stroke();

                // Draw tiny number on the petal
                const labelR = radius * 0.65;
                const lx = cx + Math.cos(midAngle) * labelR;
                const ly = cy + Math.sin(midAngle) * labelR;
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.font = 'bold 9px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 4;
                ctx.fillText(i + 1, lx, ly);
                ctx.shadowBlur = 0;
            }

            // --- 3. Draw CENTER (Golden stamen / heart) ---
            const gradCenter = ctx.createRadialGradient(cx - 15, cy - 15, 5, cx, cy, 45);
            gradCenter.addColorStop(0, '#FDE68A');
            gradCenter.addColorStop(0.5, '#C9A96E');
            gradCenter.addColorStop(1, '#8B6B4A');
            ctx.beginPath();
            ctx.arc(cx, cy, 42, 0, 2 * Math.PI);
            ctx.fillStyle = gradCenter;
            ctx.shadowColor = 'rgba(201, 169, 110, 0.6)';
            ctx.shadowBlur = 30;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Inner text
            ctx.fillStyle = '#1A2E1A';
            ctx.font = 'bold 16px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(255,255,255,0.5)';
            ctx.shadowBlur = 8;
            ctx.fillText('56', cx, cy - 3);
            ctx.font = '8px sans-serif';
            ctx.fillText('Blossoms', cx, cy + 16);
            ctx.shadowBlur = 0;
        }

        // --- Interaction logic for the flower ---
        function getFlowerIndex(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;

            const dx = x - cx;
            const dy = y - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > radius || dist < 30) return -1;

            let angle = Math.atan2(dy, dx);
            let adjusted = angle + Math.PI / 2;
            if (adjusted < 0) adjusted += 2 * Math.PI;

            const slice = (2 * Math.PI) / total;
            const index = Math.floor(adjusted / slice);
            if (index >= total) return 0;
            return index;
        }

        function onFlowerMove(e) {
            const idx = getFlowerIndex(e);
            if (idx !== hoveredIndex) {
                hoveredIndex = idx;
                drawArtsyFlower();
                if (idx >= 0 && idx < total) {
                    const g = allGroups[idx];
                    tooltip.innerHTML =
                        `🌸 ${g.name} (${g.chineseName}) <small>📍 ${g.region} · 👥 ${g.population}</small>`;
                    canvas.style.cursor = 'pointer';
                } else {
                    tooltip.innerHTML = '🌸 Hover over a petal <small>(click to learn more)</small>';
                    canvas.style.cursor = 'default';
                }
            }
        }

        function onFlowerClick(e) {
            const idx = getFlowerIndex(e);
            if (idx >= 0 && idx < total) {
                openDetail(allGroups[idx].id);
            }
        }

        canvas.addEventListener('mousemove', onFlowerMove);
        canvas.addEventListener('click', onFlowerClick);
        canvas.addEventListener('touchstart', (e) => {
            onFlowerMove(e);
            onFlowerClick(e);
        });
        canvas.addEventListener('touchmove', (e) => {
            onFlowerMove(e);
        });

        // ================================================================
        // 6. INTERACTIVE MAP (ECharts)
        // ================================================================
        let mapChart = null;

        function initMap() {
            const container = document.getElementById('mapContainer');
            if (!mapChart) {
                mapChart = echarts.init(container);
            }

            // Load China GeoJSON
            fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json')
                .then(res => res.json())
                .then(chinaJson => {
                    echarts.registerMap('china', chinaJson);

                    // Prepare scatter data for the map
                    const scatterData = allGroups.map(g => ({
                        name: g.name,
                        value: [...g.coords, 1],
                        chineseName: g.chineseName,
                        region: g.region,
                        population: g.population,
                        id: g.id,
                        intro: g.intro
                    }));

                    const option = {
                        tooltip: {
                            trigger: 'item',
                            formatter: function(params) {
                                if (params.seriesType === 'scatter') {
                                    const d = params.data;
                                    return `
                                            <strong>${d.name}</strong> (${d.chineseName})<br/>
                                            📍 ${d.region}<br/>
                                            👥 ${d.population}<br/>
                                            <span style="color:#2D8A4E;cursor:pointer;">Click to learn more</span>
                                        `;
                                }
                                return params.name;
                            }
                        },
                        visualMap: {
                            show: false,
                            min: 0,
                            max: 1,
                            inRange: {
                                color: ['#D8F3DC', '#2D8A4E']
                            }
                        },
                        geo: {
                            map: 'china',
                            roam: true,
                            zoom: 1.2,
                            center: [104, 35],
                            itemStyle: {
                                areaColor: '#E8F5E9',
                                borderColor: '#2D6A4F',
                                borderWidth: 1.2,
                                shadowColor: 'rgba(0,0,0,0.1)',
                                shadowBlur: 8
                            },
                            emphasis: {
                                itemStyle: {
                                    areaColor: '#C8E6C9'
                                }
                            }
                        },
                        series: [{
                            name: 'Ethnic Groups',
                            type: 'scatter',
                            coordinateSystem: 'geo',
                            data: scatterData,
                            symbolSize: 14,
                            label: {
                                show: true,
                                formatter: function(params) {
                                    return params.name;
                                },
                                position: 'right',
                                color: '#1A3C2A',
                                fontSize: 9,
                                fontWeight: 'bold',
                                textShadowColor: 'white',
                                textShadowBlur: 4
                            },
                            itemStyle: {
                                color: function(params) {
                                    const hues = [140, 160, 180, 120];
                                    return `hsl(${hues[params.dataIndex % hues.length]}, 70%, 50%)`;
                                },
                                shadowBlur: 10,
                                shadowColor: 'rgba(45, 138, 78, 0.4)',
                                borderColor: 'white',
                                borderWidth: 2
                            },
                            emphasis: {
                                itemStyle: {
                                    shadowBlur: 20,
                                    shadowColor: 'rgba(45, 138, 78, 0.8)',
                                    borderWidth: 3
                                }
                            },
                            // Click event handled separately below
                        }]
                    };

                    mapChart.setOption(option);

                    // Handle click on map scatter points
                    mapChart.off('click'); // Remove old listeners
                    mapChart.on('click', function(params) {
                        if (params.componentType === 'series') {
                            const data = params.data;
                            if (data && data.id) {
                                openDetail(data.id);
                            }
                        }
                    });

                    // Resize handler
                    window.addEventListener('resize', () => {
                        if (mapChart) mapChart.resize();
                    });
                })
                .catch(err => {
                    container.innerHTML =
                        `<p style="text-align:center;padding:2rem;color:#888;">⚠️ Map data failed to load. Please refresh.</p>`;
                    console.error(err);
                });
        }

        // ================================================================
        // 7. START THE APP
        // ================================================================
        renderGrid(allGroups);
        updateStats(allGroups);
        drawArtsyFlower();

        // Pre-load map in background so it's ready when tab is clicked
        setTimeout(initMap, 500);
    </script>
