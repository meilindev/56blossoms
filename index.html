<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>56 Blossoms — Interactive Mandala</title>
    <style>
        /* =============================================
                   GREEN/JADE THEME + MANDALA STYLES
                   ============================================= */
        :root {
            --jade-dark: #1A3C2A;
            --jade-bright: #2D8A4E;
            --jade-light: #74C69D;
            --jade-pale: #D8F3DC;
            --gold-accent: #C9A96E;
            --cream-base: #F4FAF5;
            --earth-brown: #5C6B4B;
            --mandala-gradient: linear-gradient(135deg, #1A3C2A, #2D6A4F, #40916C, #74C69D);
            --text-dark: #1A2E1A;
            --card-shadow: 0 8px 25px rgba(26, 60, 42, 0.15);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--cream-base);
            color: var(--text-dark);
            line-height: 1.6;
        }
        header {
            background: var(--mandala-gradient);
            padding: 2rem 1.5rem 1.5rem;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }
        header::before {
            content: "🌸";
            position: absolute;
            font-size: 10rem;
            right: -2rem;
            top: -3rem;
            opacity: 0.08;
            transform: rotate(15deg);
        }
        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        header p {
            font-size: 1rem;
            opacity: 0.95;
            font-weight: 300;
        }
        .stats-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            padding: 0.8rem 1rem;
            background: rgba(26, 60, 42, 0.05);
            border-bottom: 2px solid var(--jade-bright);
            flex-wrap: wrap;
        }
        .stats-bar span {
            font-size: 0.9rem;
            font-weight: 500;
        }
        .stats-bar strong {
            color: var(--jade-dark);
            font-size: 1.1rem;
        }
        .toggle-btn {
            background: var(--jade-dark);
            color: white;
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .toggle-btn:hover {
            background: var(--jade-bright);
            transform: scale(1.05);
        }
        .search-wrapper {
            display: flex;
            justify-content: center;
            padding: 1rem;
            background: white;
            border-bottom: 1px solid #eee;
        }
        #searchInput {
            padding: 0.6rem 1.5rem;
            width: 100%;
            max-width: 400px;
            border: 2px solid #eee;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            background: var(--cream-base);
        }
        #searchInput:focus {
            border-color: var(--jade-bright);
            box-shadow: 0 0 0 4px rgba(45, 138, 78, 0.2);
        }

        /* --- Grid View (Cards) --- */
        #gridView {
            display: block;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 1.5rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 1.2rem 1rem;
            box-shadow: var(--card-shadow);
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 5px solid var(--jade-bright);
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(26, 60, 42, 0.2);
            border-left-color: var(--gold-accent);
        }
        .card .id {
            font-size: 0.7rem;
            color: var(--jade-bright);
            font-weight: 700;
            background: rgba(45, 138, 78, 0.1);
            display: inline-block;
            padding: 0.1rem 0.7rem;
            border-radius: 50px;
        }
        .card h3 {
            font-size: 1.3rem;
            color: var(--jade-dark);
        }
        .card .chinese-name {
            font-size: 1rem;
            font-weight: 300;
            color: #888;
        }
        .card .region {
            font-size: 0.8rem;
            color: var(--earth-brown);
            background: #f0f5ed;
            display: inline-block;
            padding: 0.1rem 0.8rem;
            border-radius: 50px;
            margin: 0.3rem 0 0.4rem;
        }
        .card .intro-preview {
            font-size: 0.85rem;
            color: #555;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card .population {
            font-size: 0.75rem;
            color: var(--jade-bright);
            font-weight: 600;
            margin-top: 0.3rem;
        }

        /* --- Mandala View --- */
        #mandalaView {
            display: none;
            text-align: center;
            padding: 1.5rem 0.5rem 2rem;
        }
        #mandalaView canvas {
            max-width: 100%;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 20px 60px rgba(26, 60, 42, 0.2);
            background: white;
            cursor: pointer;
            touch-action: none;
        }
        #mandalaTooltip {
            margin-top: 1rem;
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--jade-dark);
            min-height: 3rem;
            background: rgba(255, 255, 255, 0.8);
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            display: inline-block;
            border: 2px solid var(--jade-pale);
        }
        #mandalaTooltip small {
            font-weight: 300;
            color: #888;
            font-size: 0.9rem;
        }

        /* --- Modal (Popup) --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 1rem;
        }
        .modal.open {
            display: flex;
        }
        .modal-content {
            background: white;
            max-width: 500px;
            width: 100%;
            padding: 2rem 1.8rem;
            border-radius: 30px;
            position: relative;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            animation: popIn 0.3s ease-out;
            border-top: 8px solid var(--jade-bright);
        }
        .modal-content .close-btn {
            position: absolute;
            top: 0.8rem;
            right: 1.2rem;
            font-size: 2rem;
            cursor: pointer;
            color: #aaa;
            background: none;
            border: none;
            transition: 0.3s;
        }
        .modal-content .close-btn:hover {
            color: var(--jade-dark);
            transform: rotate(90deg);
        }
        .modal-content h2 {
            color: var(--jade-dark);
            font-size: 2rem;
        }
        .modal-content .chinese-name {
            font-size: 1.2rem;
            color: #999;
        }
        .modal-content .detail-region {
            background: #f0f5ed;
            padding: 0.2rem 1rem;
            border-radius: 50px;
            display: inline-block;
            margin: 0.5rem 0;
        }
        .modal-content .detail-population {
            font-weight: 700;
            color: var(--jade-bright);
        }
        .modal-content .full-intro {
            margin-top: 1rem;
            line-height: 1.7;
            color: #333;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background: var(--text-dark);
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
        }
        footer .mandala-icon {
            font-size: 1.3rem;
            display: block;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        @media (max-width: 600px) {
            header h1 {
                font-size: 2rem;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                padding: 1rem;
                gap: 1rem;
            }
            .card {
                padding: 0.8rem;
            }
            .modal-content {
                padding: 1.5rem;
            }
            .stats-bar {
                gap: 0.8rem;
                font-size: 0.75rem;
            }
            #mandalaTooltip {
                font-size: 1rem;
            }
        }
    </style>
</head>

            { "id": "53", "name": "Tatar", "chineseName": "塔塔尔族", "population": "3,500", "region": "Xinjiang",
                "intro": "A small Turkic Muslim group known for their delicate embroidery, ornamental hats, and sweet pastries." },
            { "id": "54", "name": "Hezhen", "chineseName": "赫哲族", "population": "5,000", "region": "Heilongjiang",
                "intro": "One of the smallest, living along the Amur River. Known for their fish-skin clothing and fishing culture." },
            { "id": "55", "name": "Lhoba", "chineseName": "珞巴族", "population": "3,700", "region": "Tibet",
                "intro": "Live in the eastern Himalayas. Known for their woven cane helmets and deep shamanic traditions linked to nature spirits." },
            { "id": "56", "name": "Gaoshan", "chineseName": "高山族", "population": "300,000 (in Taiwan)", "region": "Taiwan",
                "intro": "Indigenous peoples of Taiwan. Comprising multiple tribes, known for their wood carving, weaving, and the spectacular 'Harvest Festival'." }
        ];

        // ================================================================
        // 2. GRID VIEW LOGIC (Cards + Search)
        // ================================================================
        let currentGroups = allGroups;

        function renderGrid(groups) {
            const app = document.getElementById('app');
            if (!groups.length) {
                app.innerHTML = '<p style="text-align:center;padding:3rem;color:#888;">🌸 No groups found.</p>';
                return;
            }
            let html = '<div class="grid">';
            groups.forEach(g => {
                html += `
                        <div class="card" onclick="openDetail('${g.id}')">
                            <div class="id">#${g.id}</div>
                            <h3>${g.name}</h3>
                            <div class="chinese-name">${g.chineseName}</div>
                            <div class="region">📍 ${g.region}</div>
                            <div class="intro-preview">${g.intro.slice(0, 60)}...</div>
                            <div class="population">👥 ${g.population}</div>
                        </div>
                    `;
            });
            html += '</div>';
            app.innerHTML = html;
        }

        function updateStats(groups) {
            document.getElementById('groupCount').textContent = groups.length;
            let total = 0;
            groups.forEach(g => {
                const num = parseFloat(g.population.replace(/[^0-9.]/g, ''));
                if (!isNaN(num)) total += num;
            });
            document.getElementById('popCount').textContent = (total > 1000) ? (total / 1000).toFixed(1) + 'B' : total
                .toLocaleString() + 'M';
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = allGroups.filter(g =>
                g.name.toLowerCase().includes(q) ||
                g.chineseName.includes(q) ||
                g.region.toLowerCase().includes(q)
            );
            renderGrid(filtered);
            updateStats(filtered);
        });

        // ================================================================
        // 3. MODAL (Popup Detail)
        // ================================================================
        function openDetail(id) {
            const g = allGroups.find(x => x.id === id);
            if (!g) return;
            document.getElementById('modalName').textContent = g.name;
            document.getElementById('modalChinese').textContent = g.chineseName;
            document.getElementById('modalRegion').textContent = '📍 ' + g.region;
            document.getElementById('modalPopulation').textContent = '👥 Population: ' + g.population;
            document.getElementById('modalIntro').textContent = g.intro;
            document.getElementById('detailModal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('open');
        }
        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ================================================================
        // 4. TOGGLE: Grid <-> Mandala
        // ================================================================
        let isMandalaView = false;
        const gridView = document.getElementById('gridView');
        const mandalaView = document.getElementById('mandalaView');
        const toggleBtn = document.getElementById('toggleViewBtn');

        toggleBtn.addEventListener('click', () => {
            isMandalaView = !isMandalaView;
            if (isMandalaView) {
                gridView.style.display = 'none';
                mandalaView.style.display = 'block';
                toggleBtn.textContent = '📋 View Grid';
                drawMandala();
            } else {
                gridView.style.display = 'block';
                mandalaView.style.display = 'none';
                toggleBtn.textContent = '🌀 View Mandala';
            }
        });

        // ================================================================
        // 5. THE INTERACTIVE MANDALA (Canvas)
        // ================================================================
        const canvas = document.getElementById('mandalaCanvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('mandalaTooltip');

        const total = allGroups.length;
        const centerX = 300,
            centerY = 300;
        const radius = 240;
        let hoveredIndex = -1;

        function getColor(index, highlight = false) {
            // Green gradient around the circle (dark green -> light green -> teal)
            const hue = 120 + (index / total) * 60; // 120 (green) to 180 (teal)
            const sat = highlight ? 90 : 70;
            const lig = highlight ? 65 : 45;
            return `hsl(${hue}, ${sat}%, ${lig}%)`;
        }

        function drawMandala() {
            const w = canvas.width,
                h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            const slice = (2 * Math.PI) / total;

            for (let i = 0; i < total; i++) {
                const start = i * slice - Math.PI / 2;
                const end = start + slice;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, start, end);
                ctx.closePath();

                // Color: highlight if hovered
                const isHover = (i === hoveredIndex);
                ctx.fillStyle = getColor(i, isHover);
                ctx.fill();

                // Stroke (separator lines)
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Draw the group number on the petal
                const midAngle = start + slice / 2;
                const labelR = radius * 0.7;
                const x = centerX + Math.cos(midAngle) * labelR;
                const y = centerY + Math.sin(midAngle) * labelR;

                ctx.fillStyle = 'white';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 4;
                ctx.fillText(i + 1, x, y);
                ctx.shadowBlur = 0;
            }

            // Draw center circle
            const grad = ctx.createRadialGradient(centerX - 10, centerY - 10, 5, centerX, centerY, 35);
            grad.addColorStop(0, '#C9A96E');
            grad.addColorStop(1, '#1A3C2A');
            ctx.beginPath();
            ctx.arc(centerX, centerY, 32, 0, 2 * Math.PI);
            ctx.fillStyle = grad;
            ctx.shadowBlur = 20;
            ctx.shadowColor = 'rgba(201, 169, 110, 0.5)';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = 'white';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('56', centerX, centerY - 2);
            ctx.font = '8px sans-serif';
            ctx.fillText('Blossoms', centerX, centerY + 14);
        }

        // --- Mouse / Touch Detection ---
        function getGroupIndex(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;

            const dx = x - centerX;
            const dy = y - centerY;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > radius || dist < 20) return -1;

            let angle = Math.atan2(dy, dx); // -PI to PI
            // Shift so 0 is at top (12 o'clock)
            let adjusted = angle + Math.PI / 2;
            if (adjusted < 0) adjusted += 2 * Math.PI;

            const slice = (2 * Math.PI) / total;
            const index = Math.floor(adjusted / slice);
            if (index >= total) return 0;
            return index;
        }

        function onCanvasMove(e) {
            const idx = getGroupIndex(e);
            if (idx !== hoveredIndex) {
                hoveredIndex = idx;
                drawMandala();
                if (idx >= 0 && idx < total) {
                    const g = allGroups[idx];
                    tooltip.innerHTML = `🌸 ${g.name} (${g.chineseName}) <small>📍 ${g.region}</small>`;
                    canvas.style.cursor = 'pointer';
                } else {
                    tooltip.innerHTML = '🌸 Hover over a petal <small>(click to open)</small>';
                    canvas.style.cursor = 'default';
                }
            }
        }

        function onCanvasClick(e) {
            const idx = getGroupIndex(e);
            if (idx >= 0 && idx < total) {
                openDetail(allGroups[idx].id);
            }
        }

        canvas.addEventListener('mousemove', onCanvasMove);
        canvas.addEventListener('click', onCanvasClick);
        canvas.addEventListener('touchstart', (e) => {
            onCanvasMove(e);
            onCanvasClick(e);
        });
        canvas.addEventListener('touchmove', (e) => {
            onCanvasMove(e);
        });

        // ================================================================
        // 6. START THE APP
        // ================================================================
        renderGrid(allGroups);
        updateStats(allGroups);
        drawMandala(); // pre-draw the mandala (hidden until toggle)
    </script>

</body>
</html>
